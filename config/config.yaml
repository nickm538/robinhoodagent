# ======================================================================
#  rh-agent strategy configuration
#  -----------------------------------------------------------------
#  This file is the "trading floor rulebook". Every number here is a
#  deliberate, documented choice. Nothing in the engine is hard-coded
#  past what you see here, so you can tune the whole system from one place.
# ======================================================================

meta:
  name: "Quantamental Panel-of-5"
  # North-star objective. NOTE: this is a *target*, not a promise. No system
  # can guarantee beating, let alone doubling, the index. See README risk notes.
  objective: "Maximize 1- and 3-month risk-adjusted return vs SPY/DIA"
  benchmarks: ["SPY", "DIA"]      # S&P 500 and Dow proxies
  base_currency: "USD"

# ----------------------------------------------------------------------
# EXECUTION  — real-money Agentic account (override via .env if needed)
# ----------------------------------------------------------------------
execution:
  mode: "live"                   # live | paper — this deployment trades real money

# ----------------------------------------------------------------------
# DATA PROVIDERS  — priority/fallback order. The MarketData facade tries
# them in order and uses the first that answers. MBOUM + FinancialDatasets
# are prioritized per mandate.
# ----------------------------------------------------------------------
providers:
  # PAID DATA ROUTING: FinancialDatasets.AI is the preferred primary source
  # wherever it has coverage, with MBOUM as the next paid fallback and
  # TwelveData retained as a tertiary backup for quote/price continuity.
  # Alpha Vantage still fills cheaper niche gaps (news, macro, movers).
  fundamentals:   ["financialdatasets", "mboum", "alphavantage"]
  prices:         ["financialdatasets", "mboum", "twelvedata", "alphavantage"]
  quote:          ["financialdatasets", "mboum", "twelvedata", "alphavantage"]
  quote_risk:     ["financialdatasets", "mboum", "twelvedata", "alphavantage"]
  technicals:     ["twelvedata", "mboum", "alphavantage"]   # computed locally first; provider values enrich gaps
  insider:        ["financialdatasets", "mboum"]   # FD re-enabled: lower-frequency smart-money (720m TTL)
  institutional:  ["financialdatasets", "mboum"]   # FD re-enabled: lower-frequency smart-money (1440m TTL)
  news_sentiment: ["financialdatasets", "alphavantage", "mboum", "web"]  # web is last resort and disabled unless explicitly enabled
  news_headlines: ["financialdatasets", "alphavantage", "web"]           # structured APIs first, web only enriches AI context
  analyst_ratings: ["mboum"]
  short_interest: ["mboum"]
  options_flow:   ["alphavantage", "mboum"]
  pro_scores:     ["web"]         # Zacks / Morningstar / Danelfin / TipRanks via web research
  macro:          ["alphavantage"]
  # Universe/discovery: mboum paginated listing for the base set; Alpha Vantage
  # TOP_GAINERS_LOSERS for the intraday movers feed (mboum has no movers endpoint).
  universe:       ["mboum", "twelvedata", "alphavantage"]
  movers:         ["alphavantage", "twelvedata"]
  # TwelveData paid-plan tuning. Check your dashboard and set
  # TWELVEDATA_MAX_PER_SEC or this value below your plan's request/sec limit.
  twelvedata_max_per_sec: 8
  # TwelveData market_movers costs 100 credits/request; Alpha Vantage's movers
  # feed remains the default. Set true only if you want to spend TD credits here.
  twelvedata_enable_market_movers: false
  # Exa/Firecrawl are intentionally narrow: they enrich only parsed pro-source
  # score fields by default. Generic web-news sentiment is off to avoid noise
  # and look-forward bias; Alpha Vantage remains the structured news feed.
  cache_ttl_minutes:
    quote: 3
    prices: 720
    fundamentals: 1440
    insider: 720
    institutional: 1440
    news_sentiment: 120
    analyst_ratings: 720
    macro: 720
    pro_scores: 720

# Exa + Firecrawl guardrails. Web data only runs during live/deep scans, never in
# snapshot/backtest provider mode. It populates parsed pro-score fields and AI
# headline context; generic web sentiment is an explicit opt-in last resort.
web_research:
  enabled: true
  combine_engines: true
  max_search_results: 3
  max_chars_per_search: 8000
  exa_recency_days: 3
  min_sentiment_hits: 4
  pro_scores_ttl_minutes: 720
  headlines_ttl_minutes: 60
  sentiment_ttl_minutes: 120
  enable_news_sentiment: false

# ----------------------------------------------------------------------
# UNIVERSE  — what is eligible to trade. "Full universe minus penny stocks
# and poor liquidity" per mandate.
# ----------------------------------------------------------------------
universe:
  source: "auto"                  # auto = listing status + index members; or "snapshot"
  include_etfs: false             # equities only (Robinhood agentic beta is equities-only)
  exclude_otc: true
  exclude_funds: true
  liquidity:
    min_price: 5.0                # no penny stocks
    max_price: 100000.0
    min_market_cap: 300000000     # widen to liquid small/mid caps for "diamond" discovery
    min_avg_dollar_volume: 2000000  # enough liquidity to trade without chasing microcaps
    min_avg_volume_shares: 100000
    min_history_days: 200         # need enough bars for 200dma / 12-1 momentum
  scan_cap: 400                   # cap raw market scan per pass (cost + latency bound)
  # Hard exclusions
  exclude_sectors: []             # e.g. ["Energy"] to sit out a sector
  blacklist: []                   # tickers to never trade
  # Empty watchlist = discover candidates dynamically from provider listing feeds.
  watchlist: []
  # Intraday radar: fast quote/volume/change filter before expensive deep scoring.
  intraday:
    enabled: true
    quote_max_age_seconds: 60
    max_candidates: 120
    min_candidates: 30
    min_day_change_pct: 2.0
    min_positive_day_change_pct: 0.5
    min_relative_volume: 1.5
    min_dollar_volume_today: 2000000
    min_breakout_pct: 0.01
    fallback_to_liquid_universe: true
    use_movers_feed: true           # seed today's top gainers / most-active into the hunt
    movers_limit: 35                # how many movers to pull from the feed each scan (more runners)
    batch_quote_prefetch: true      # TwelveData batch quotes warm the radar before per-name light checks
  # Two-stage funnel: light-rank the WHOLE list on fast signals, then deep-score +
  # AI-review only the top survivors — keeps a wide hunt tractable on small hardware.
  two_stage_threshold: 40         # above this many names, engage the funnel
  deep_top_k: 20                  # deep-score (+ AI) only the top N from the light pass
  # Coarse pre-screen (used in auto/full-universe mode).
  prescreen:
    enabled: true
    max_candidates: 150           # deep-score at most this many survivors per run

# ----------------------------------------------------------------------
# THE PANEL OF FIVE  — five veteran-trader personas (an ensemble). Each
# scores every candidate 0..100 from its own factor lens. The Chief PM
# (regime engine) blends them with weights that adapt to the market.
# ----------------------------------------------------------------------
analysts:
  momentum_trader:
    description: "Trend & price momentum. Buys strength, respects the tape."
    factors:
      mom_12_1: 0.28              # 12-month return excl. last month (classic anomaly)
      mom_6_1: 0.18
      mom_3_1: 0.12
      risk_adj_momentum: 0.16     # return / volatility (Sharpe-like)
      trend_sma: 0.14             # price vs 50/200dma, 50>200 golden-cross
      dist_52w_high: 0.12         # proximity to 52-wk high (capped to avoid blowoff)
  quant:
    description: "Quality + factor fundamentals. Wants durable, efficient compounders."
    factors:
      roe: 0.16
      roic: 0.16
      gross_margin: 0.10
      net_margin: 0.10
      revenue_growth: 0.14
      earnings_growth: 0.14
      fcf_yield: 0.10
      balance_sheet_strength: 0.10   # debt/equity, current ratio, interest coverage
  catalyst_trader:
    description: "Earnings revisions & surprises — the engine behind 'estimate momentum'."
    factors:
      eps_estimate_revision: 0.34
      earnings_surprise_history: 0.26
      revenue_estimate_revision: 0.20
      upcoming_catalyst: 0.20        # earnings within horizon (opportunity + risk flag)
  smart_money:
    description: "Follows insiders & institutions — informed-flow tracker."
    factors:
      insider_net_buying: 0.40
      institutional_net_buying: 0.35
      short_squeeze_setup: 0.25      # short interest + days-to-cover vs rising price
  sentiment_analyst:
    description: "News, options positioning, and pro-source ratings (Zacks/M*/Danelfin/TipRanks)."
    factors:
      news_sentiment: 0.28
      options_positioning: 0.16      # put/call ratio (contrarian-aware)
      zacks_rank: 0.16
      analyst_consensus_upside: 0.18 # price-target upside + buy ratio
      danelfin_ai: 0.12
      morningstar: 0.10

# ----------------------------------------------------------------------
# REGIME ENGINE  — "weighted scoring optimized for the current market".
# Detects the regime from price trend / volatility / breadth / rates,
# then chooses which analysts to lean on.
# ----------------------------------------------------------------------
regime:
  signals:
    spx_trend_lookback: 200       # SPX vs its 200dma
    vix_calm_below: 16
    vix_stress_above: 26
    breadth_proxy: "RSP_vs_SPY"   # equal-weight vs cap-weight (breadth)
  # Ensemble weights per regime. Rows sum to 1.0. The Chief PM picks the row.
  weights:
    risk_on_trend:    {momentum_trader: 0.34, quant: 0.16, catalyst_trader: 0.22, smart_money: 0.12, sentiment_analyst: 0.16}
    neutral:          {momentum_trader: 0.24, quant: 0.24, catalyst_trader: 0.20, smart_money: 0.16, sentiment_analyst: 0.16}
    risk_off:         {momentum_trader: 0.12, quant: 0.40, catalyst_trader: 0.14, smart_money: 0.18, sentiment_analyst: 0.16}
    high_volatility:  {momentum_trader: 0.18, quant: 0.34, catalyst_trader: 0.16, smart_money: 0.16, sentiment_analyst: 0.16}
  # Gross-exposure throttle per regime (fraction of equity deployed).
  exposure:
    risk_on_trend: 1.00
    neutral: 0.85
    risk_off: 0.50
    high_volatility: 0.60

# ----------------------------------------------------------------------
# NORMALIZATION / NOISE CONTROL  — robust cross-sectional scoring.
# ----------------------------------------------------------------------
normalize:
  method: "rank_percentile"      # winsorise outliers, then cross-sectional rank -> 0..100
  winsorize_sigma: 3.0           # clip outliers at +/- 3 sigma before scoring
  min_factor_coverage: 0.5       # a factor needs >=50% of names to count, else neutralized
  # Require multi-pillar confirmation to make the buy list (kills single-signal noise).
  min_pillars_passing: 1         # HUNTER: 1 strong pillar qualifies — lets it buy best-scorers and
                                 # snipe momentum runners (which may light up only one pillar). Set 2 (or
                                 # RH_MIN_PILLARS=2) to require multi-pillar confirmation / less noise.
                                 # Not all pillars reliably have data; deep pillars are sparse. 3 starved the book to 1 name.
  pillar_pass_threshold: 52.0    # a pillar "passes" a bit easier -> more names clear multi-pillar gate

# ----------------------------------------------------------------------
# PORTFOLIO CONSTRUCTION & RISK  — veteran discipline.
# ----------------------------------------------------------------------
portfolio:
  target_positions: 5            # ~$500 account -> 5 positions ~$85 each, comfortably above the $20 min
  min_conviction_score: 50.0     # composite floor (loosened for more deployment); the book is
                                 # capped at the (auto-scaled) target_positions, so this just gates fill
  weighting: "vol_target"        # inverse-volatility / conviction blend
  conviction_tilt: 0.5           # 0=pure inverse-vol, 1=pure conviction-weighted
  max_position_weight: 0.30      # small account: lets the top name tilt while keeping 5 names viable
  min_position_weight: 0.02
  max_sector_weight: 0.60        # relaxed for a small 5-name book (light diversification)
  cash_floor: 0.02
  # AUTO-SCALE the book to the account size. At each rebalance the builder picks
  # the highest tier whose min-equity <= current equity and uses its position
  # count + caps (overriding the static target_positions / max_*_weight above).
  # A growing account widens and diversifies itself — no manual retuning.
  # Set enabled: false to use the static values. [min_equity, positions, name_cap, sector_cap]
  autoscale:
    enabled: true
    tiers:
      - [0,      3, 0.40, 0.70]   # micro: a few concentrated names
      - [400,    5, 0.30, 0.60]   # ~$500 (current)
      - [2000,   8, 0.18, 0.45]
      - [10000, 10, 0.14, 0.40]
      - [25000, 12, 0.12, 0.35]   # full diversified book past the PDT threshold
  rebalance:
    schedule: "intraday"         # AGGRESSIVE: re-rank every 30 min (cost middle-ground
                                 # between 15-min firehose and hourly). Stops/TPs are
                                 # decoupled and still checked every 60s regardless.
    intraday_hours: 0.5          # 30 minutes between hunts
    no_trade_band: 0.01          # act on drift >= 1% — more responsive rebalancing
    max_turnover_per_rebalance: 0.40  # allow more rotation per rebalance
    # Sell discipline: stops/TPs still fire every tick. Exit gates are now close to
    # the entry gates so stale holds are actively ROTATED OUT for fresh conviction
    # (a small buffer below entry avoids boundary flip-flop).
    exit_hysteresis_enabled: true
    exit_conviction_score: 47.0  # sell a held name once composite drops below this
    exit_min_pillars: 2          # held names must keep multi-pillar support, else rotate out
    hold_on_missing_data: true
    exit_on_ai_caution: true
    exit_on_high_volatility: false
    exit_on_earnings_within_days: 0
  risk_controls:
    stop_loss_atr_mult: 2.5      # initial + trailing stop at N× ATR(14) from high-water mark
    take_profit_atr_mult: 6.0
    hard_stop_pct: 0.18          # absolute -18% disaster stop floor
    max_daily_drawdown_halt: 0.06  # halt new buys if port down >6% in a day (sells still run)
    per_trade_risk_pct: 0.02     # DEPLOY: ~2% equity risk per name at stop. At 0.01, high-ATR names
                                 # were capped to ~6-8% weight -> ~86% idle cash. 0.02 lets the book
                                 # actually reach the regime exposure target (stops still bound losses).
    block_stale_quote: true      # never open/add from stale live quote data
    block_ai_caution: true       # exclude names flagged bearish by Claude overlay
    block_earnings_within_days: 2  # skip new entries within N days of earnings
    block_high_volatility: false

# ----------------------------------------------------------------------
# BACKTEST  — walk-forward, real prices, vs benchmark.
# ----------------------------------------------------------------------
# ----------------------------------------------------------------------
# AI ANALYST  — the 6th, LLM-in-the-loop voice (Claude). Optional.
# Once per rebalance it reviews the shortlist + market news and reasons about
# catalysts + geopolitical/macro risk, blended into the composite by `weight`.
# Requires ANTHROPIC_API_KEY and the `anthropic` package; no-ops without them.
# ----------------------------------------------------------------------
ai_analyst:
  enabled: true
  model: "claude-opus-4-8"      # max reasoning for catalyst/macro overlay (RH_AI_MODEL to override)
  effort: "medium"             # low | medium | high  (depth vs cost per cycle)
  weight: 0.30                 # blend: composite = 0.70*quant + 0.30*AI (strong, not dominant, voice)
  max_candidates: 12           # send the top N quant names to Claude (middle-ground cost)
  max_tokens: 6000

# ----------------------------------------------------------------------
# DATA  — concurrency for live full-universe scans (snapshot runs serial).
# ----------------------------------------------------------------------
data:
  max_workers: 8
  freshness:
    quote_max_age_seconds: 120
    prices_max_age_days: 5

# ----------------------------------------------------------------------
# DAEMON  — the always-on autonomous loop.
# ----------------------------------------------------------------------
daemon:
  poll_seconds: 60             # risk/stop checks every minute; rebalance gated by cadence above
  trade_only_when_open: true   # only trade during US market hours
  manage_stops_every_tick: true
  scan_timeout_seconds: 1800   # watchdog: abandon a background scan that runs longer than
                               # this (a true hang) so hunting can never silently stall.
                               # Normal scans take ~10-15 min; 30 min only trips on a stall.

# ----------------------------------------------------------------------
# JOURNAL / MEMORY  — self-improving log. Records every executed order with its
# decision context, reconstructs realized P&L, feeds a bounded performance
# summary into the AI overlay, and writes a human-readable memory.md digest.
# It NEVER changes strategy parameters on its own.
# ----------------------------------------------------------------------
journal:
  enabled: true
  path: "state/journal.jsonl"
  memory_md: "state/memory.md"
  summary_trades: 20           # how many recent closed trades to surface

# ----------------------------------------------------------------------
backtest:
  start: "2019-01-01"
  end: "auto"
  initial_equity: 100000
  rebalance: "monthly"           # matches the 1-month evaluation horizon
  commission_bps: 1.0            # Robinhood is commission-free; model tiny slippage
  slippage_bps: 5.0
  benchmark: "SPY"
